<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep1 – Lecteur</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
    #video-wrap { position: relative; width: 100vw; height: 100vh; background: #000; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff; font-size: 14px; background: rgba(0,0,0,.7);
    }
    .loading.hidden { display: none; }
    .controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,.85), transparent);
      padding: 40px 20px 16px; display: flex; flex-direction: column; gap: 10px;
      opacity: 0; transition: opacity .3s;
    }
    #video-wrap:hover .controls, .controls.visible { opacity: 1; }
    .progress-bar {
      width: 100%; height: 4px; background: rgba(255,255,255,.25);
      border-radius: 2px; cursor: pointer; position: relative;
    }
    .progress-fill { height: 100%; background: #e50914; border-radius: 2px; width: 0; }
    .controls-row { display: flex; align-items: center; gap: 14px; color: #fff; }
    .controls-row button {
      background: none; border: none; color: #fff; cursor: pointer;
      font-size: 18px; padding: 4px; display: grid; place-items: center;
    }
    .controls-row button:hover { opacity: .7; }
    .time { font-size: 12px; color: #ccc; }
    .volume-slider { width: 70px; accent-color: #e50914; }
    .spacer { flex: 1; }
    .quality-select {
      background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px; padding: 4px 8px; font-size: 12px; outline: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="video-wrap">
    <video id="video" playsinline></video>
    <div class="loading" id="loading">Chargement du flux…</div>
    <div class="controls" id="controls">
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="controls-row">
        <button id="play-btn">▶</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <div class="spacer"></div>
        <select class="quality-select" id="quality-select"></select>
        <input type="range" class="volume-slider" id="volume" min="0" max="1" step="0.05" value="1" />
        <button id="mute-btn">🔊</button>
        <button id="fs-btn">⛶</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const tmdbId = params.get('tmdb');
    const type = params.get('type') || 'movie';       // movie | tv
    const season = params.get('season') || '1';
    const episode = params.get('episode') || '1';
    const lang = params.get('lang') || 'vf';

    const video = document.getElementById('video');
    const loading = document.getElementById('loading');
    const controls = document.getElementById('controls');
    const playBtn = document.getElementById('play-btn');
    const timeEl = document.getElementById('time');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const volume = document.getElementById('volume');
    const muteBtn = document.getElementById('mute-btn');
    const fsBtn = document.getElementById('fs-btn');
    const qualitySelect = document.getElementById('quality-select');

    // Backend proxy (à déployer) — configure ici ton URL Render/Railway
    const BACKEND = window.DEEP1_BACKEND || 'https://deep1-proxy.onrender.com';

    let hls = null;

    async function loadStream() {
      try {
        const apiUrl = `${BACKEND}/stream?tmdb=${tmdbId}&type=${type}&season=${season}&episode=${episode}&lang=${lang}`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('Flux indisponible');
        const data = await res.json();
        const url = data.url; // URL .m3u8 proxifiée
        if (!url) throw new Error('Pas de flux');

        if (hls) { hls.destroy(); hls = null; }

        if (window.Hls && Hls.isSupported()) {
          hls = new Hls({ enableWorker: true });
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
            // Peupler les qualités
            qualitySelect.innerHTML = '';
            data.levels.forEach((lvl, i) => {
              const opt = document.createElement('option');
              opt.value = i;
              opt.textContent = lvl.height ? `${lvl.height}p` : `Niv. ${i+1}`;
              qualitySelect.appendChild(opt);
            });
            const autoOpt = document.createElement('option');
            autoOpt.value = 'auto'; autoOpt.textContent = 'Auto';
            qualitySelect.prepend(autoOpt);
            qualitySelect.value = 'auto';
            loading.classList.add('hidden');
            video.play().catch(() => {});
          });
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) { loading.textContent = 'Erreur de lecture.'; loading.classList.remove('hidden'); }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
          video.addEventListener('loadedmetadata', () => { loading.classList.add('hidden'); video.play().catch(()=>{}); });
        } else {
          throw new Error('HLS non supporté');
        }
      } catch (e) {
        loading.textContent = 'Impossible de charger le flux : ' + e.message;
        loading.classList.remove('hidden');
      }
    }

    // Contrôles
    playBtn.addEventListener('click', () => {
      if (video.paused) video.play(); else video.pause();
    });
    video.addEventListener('play', () => playBtn.textContent = '⏸');
    video.addEventListener('pause', () => playBtn.textContent = '▶');
    video.addEventListener('timeupdate', () => {
      if (!video.duration) return;
      const pct = (video.currentTime / video.duration) * 100;
      progressFill.style.width = pct + '%';
      timeEl.textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
    });
    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      video.currentTime = pct * video.duration;
    });
    volume.addEventListener('input', () => { video.volume = volume.value; });
    muteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      muteBtn.textContent = video.muted ? '🔇' : '🔊';
    });
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });
    qualitySelect.addEventListener('change', () => {
      if (!hls) return;
      if (qualitySelect.value === 'auto') hls.currentLevel = -1;
      else hls.currentLevel = parseInt(qualitySelect.value, 10);
    });
    document.addEventListener('mousemove', () => {
      controls.classList.add('visible');
      clearTimeout(window._hideTimer);
      window._hideTimer = setTimeout(() => controls.classList.remove('visible'), 3000);
    });

    function fmt(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    loadStream();
  </script>
</body>
</html>
