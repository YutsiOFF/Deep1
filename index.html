<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep1 – Streaming</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Navigation -->
  <header class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="#" class="logo">DEEP<span>1</span></a>
      <nav class="nav-links">
        <a href="#accueil" class="active">Accueil</a>
        <a href="#tendances">Tendances</a>
        <a href="#nouveautes">Nouveautés</a>
        <a href="#series">Séries</a>
      </nav>
      <div class="nav-actions">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="search-input" placeholder="Rechercher un film, une série…" />
        </div>
        <div class="avatar">K</div>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="accueil">
    <div class="hero-backdrop" id="hero-backdrop"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
      <span class="hero-badge">À la une</span>
      <h1 class="hero-title" id="hero-title">Chargement…</h1>
      <p class="hero-overview" id="hero-overview"></p>
      <div class="hero-meta" id="hero-meta"></div>
      <div class="hero-actions">
        <button class="btn btn-primary" id="hero-play">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Lecture
        </button>
        <button class="btn btn-secondary" id="hero-info">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          Plus d'infos
        </button>
      </div>
    </div>
  </section>

  <!-- Barre de filtres -->
  <section class="filters-bar" id="filters-bar">
    <div class="filters-inner">
      <div class="filter-group">
        <label for="filter-type">Type</label>
        <select id="filter-type">
          <option value="movie">Films</option>
          <option value="tv">Séries</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-genre">Catégorie</label>
        <select id="filter-genre">
          <option value="">Toutes</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-year">Année</label>
        <select id="filter-year">
          <option value="">Toutes</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="filter-sort">Tri</label>
        <select id="filter-sort">
          <option value="popularity.desc">Popularité</option>
          <option value="vote_average.desc">Mieux notés</option>
          <option value="primary_release_date.desc">Plus récents</option>
          <option value="primary_release_date.asc">Plus anciens</option>
        </select>
      </div>
      <button class="btn btn-primary btn-apply" id="apply-filters">Filtrer</button>
      <button class="btn btn-secondary btn-reset" id="reset-filters">Réinitialiser</button>
    </div>
  </section>

  <!-- Résultats de filtres / recherche -->
  <section class="row-section" id="filter-results-section" style="display:none;">
    <div class="row-header">
      <h2 id="filter-results-title">Résultats</h2>
    </div>
    <div class="row-scroll" id="filter-results"></div>
    <div class="load-more-wrap">
      <button class="btn btn-secondary" id="load-more">Charger plus</button>
    </div>
  </section>

  <!-- Rangées de films -->
  <main class="main-content">
    <section class="row-section" id="tendances">
      <div class="row-header">
        <h2>Tendances</h2>
        <div class="row-controls">
          <button class="scroll-btn" data-dir="left" data-target="row-tendances">‹</button>
          <button class="scroll-btn" data-dir="right" data-target="row-tendances">›</button>
        </div>
      </div>
      <div class="row-scroll" id="row-tendances"></div>
    </section>

    <section class="row-section" id="nouveautes">
      <div class="row-header">
        <h2>Nouveautés</h2>
        <div class="row-controls">
          <button class="scroll-btn" data-dir="left" data-target="row-nouveautes">‹</button>
          <button class="scroll-btn" data-dir="right" data-target="row-nouveautes">›</button>
        </div>
      </div>
      <div class="row-scroll" id="row-nouveautes"></div>
    </section>

    <section class="row-section">
      <div class="row-header">
        <h2>Films populaires</h2>
        <div class="row-controls">
          <button class="scroll-btn" data-dir="left" data-target="row-populaires">‹</button>
          <button class="scroll-btn" data-dir="right" data-target="row-populaires">›</button>
        </div>
      </div>
      <div class="row-scroll" id="row-populaires"></div>
    </section>

    <section class="row-section" id="series">
      <div class="row-header">
        <h2>Séries</h2>
        <div class="row-controls">
          <button class="scroll-btn" data-dir="left" data-target="row-series">‹</button>
          <button class="scroll-btn" data-dir="right" data-target="row-series">›</button>
        </div>
      </div>
      <div class="row-scroll" id="row-series"></div>
    </section>

    <section class="row-section">
      <div class="row-header">
        <h2>Mieux notés</h2>
        <div class="row-controls">
          <button class="scroll-btn" data-dir="left" data-target="row-top">‹</button>
          <button class="scroll-btn" data-dir="right" data-target="row-top">›</button>
        </div>
      </div>
      <div class="row-scroll" id="row-top"></div>
    </section>
  </main>

  <!-- Modale de détails / lecture -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-hero" id="modal-hero"></div>
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-meta" id="modal-meta"></div>
        <p class="modal-overview" id="modal-overview"></p>
        <div class="modal-actions">
          <button class="btn btn-primary" id="modal-play">▶ Regarder</button>
          <button class="btn btn-secondary" id="modal-trailer">Bande-annonce</button>
        </div>
        <div class="source-bar" id="source-bar">
          <span class="source-label">Source :</span>
          <button class="source-btn active" data-source="moviez">MoviezAPI</button>
          <button class="source-btn" data-source="cinesrc">CineSrc (moins de pubs)</button>
        </div>
        <div id="lang-bar"></div>
        <div id="episode-bar" style="display:none;"></div>
        <div class="player-container" id="player-container" style="display:none;">
          <iframe id="player-frame" allowfullscreen allow="autoplay; fullscreen"></iframe>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Deep1 — Démo de streaming. Données : TMDB · Lecteurs : MoviezAPI & CineSrc.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
